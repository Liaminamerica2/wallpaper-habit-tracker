# Copy to ~/.cloudflared/config.yml and fill in TUNNEL_UUID + hostname.
# Prerequisites: domain DNS on Cloudflare (you already have this).
#
# One-time setup (run on the machine that will host the server):
#
#   1. cloudflared tunnel login
#      Opens a browser; pick the Cloudflare account that owns the domain.
#
#   2. cloudflared tunnel create habit-wallpaper
#      Note the printed Tunnel ID (UUID). A credentials file is written to:
#        ~/.cloudflared/<TUNNEL_UUID>.json
#
#   3. cloudflared tunnel route dns habit-wallpaper habits.example.com
#      Creates a CNAME in Cloudflare DNS (replace habits.example.com).
#      Or add a CNAME manually: habits -> <TUNNEL_ID>.cfargotunnel.com (proxied).
#
#   4. Copy this file to ~/.cloudflared/config.yml and set tunnel, credentials-file,
#      and hostname below.
#
#   5. Start the habit server, then the tunnel (reads ~/.cloudflared/config.yml):
#        python /path/to/server.py
#        cloudflared tunnel run
#
# Optional — run tunnel at boot (Linux):
#   sudo cloudflared service install
#   sudo systemctl enable --now cloudflared
#
tunnel: TUNNEL_UUID
credentials-file: /home/YOUR_USER/.cloudflared/TUNNEL_UUID.json

ingress:
  - hostname: habits.example.com
    service: http://127.0.0.1:8080
  - service: http_status:404
